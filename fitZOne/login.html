<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitZOne | Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/login.css">

</head>


<body>

<div class="container">


    <div class="left">

        <i class="fa-solid fa-dumbbell"></i>

        <h1>Welcome Back!</h1>

        <p>
            Log in to continue your fitness journey with
            FitZOne and achieve your daily goals.
        </p>

    </div>


    <div class="right">

        <!-- Login form -->
        <form id="loginForm">

            <h2>Login</h2>


            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required>

            </div>


            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required>

            </div>


            <div class="forgot">

                <a href="#">Forgot Password?</a>

            </div>


            <button type="submit">
                Login
            </button>


            <!-- Login success/error message -->
            <p id="message"></p>


            <div class="signup">

                Don't have an account?

                <a href="signup.html">Sign Up</a>

            </div>

        </form>

    </div>


</div>


<!-- Login JavaScript -->
<script src="./js/login.js"></script>

</body>

</html>
