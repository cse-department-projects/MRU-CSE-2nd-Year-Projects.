<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="navbar(pageTitle, userObj)" class="app-navbar">
    <div class="d-flex align-items-center gap-3">
        <h2 class="page-heading" th:text="${pageTitle}">Dashboard</h2>
    </div>

    <div class="d-flex align-items-center gap-3">
        <!-- Quick Emergency Notice Pill -->
        <a href="/citizen/emergency" class="btn btn-sm btn-outline-danger rounded-pill px-3 py-1 font-weight-bold d-none d-md-inline-flex align-items-center gap-2">
            <i class="fa-solid fa-triangle-exclamation text-danger">active</i> Emergency SOS
        </a>

        <!-- User Profile Badge -->
        <div class="user-badge" th:if="${userObj != null}">
            <div class="avatar-circle" th:text="${#strings.substring(userObj.fullName, 0, 1)}">U</div>
            <div class="d-none d-sm-block text-start me-1">
                <div class="fw-bold fs-7 lh-1" th:text="${userObj.fullName}">User Name</div>
                <div class="text-muted fs-8 lh-1 mt-1" th:text="${userObj.role}">CITIZEN</div>
            </div>
            <a href="/logout" class="text-danger ms-2" title="Logout">
                <i class="fa-solid fa-right-from-bracket"></i>
            </a>
        </div>
    </div>
</header>

</body>
</html>
