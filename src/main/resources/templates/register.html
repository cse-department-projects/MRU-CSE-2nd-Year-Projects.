<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Village System - Citizen Registration</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-bg py-5">

<div class="auth-card" style="max-width: 600px;">
    <div class="auth-header">
        <div class="auth-logo">
            <i class="fa-solid fa-address-card"></i>
        </div>
        <h4 class="fw-extrabold text-dark mb-1">Citizen Registration</h4>
        <p class="text-muted fs-7">Create your profile to access smart village services</p>
    </div>

    <!-- Alert Box -->
    <div th:if="${errorMessage != null}" class="alert alert-danger alert-custom mb-3">
        <i class="fa-solid fa-circle-exclamation me-2"></i>
        <span th:text="${errorMessage}">Error message</span>
    </div>

    <form th:action="@{/register}" method="post" th:object="${user}">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label font-weight-bold fs-7">Full Name *</label>
                <input type="text" th:field="*{fullName}" class="form-control form-control-custom" placeholder="e.g. Ramesh Kumar" required>
            </div>
            <div class="col-md-6">
                <label class="form-label font-weight-bold fs-7">Username *</label>
                <input type="text" th:field="*{username}" class="form-control form-control-custom" placeholder="Choose username" required>
            </div>

            <div class="col-md-6">
                <label class="form-label font-weight-bold fs-7">Password *</label>
                <input type="password" th:field="*{password}" class="form-control form-control-custom" placeholder="Create password" required>
            </div>
            <div class="col-md-6">
                <label class="form-label font-weight-bold fs-7">Phone Number *</label>
                <input type="tel" th:field="*{phone}" class="form-control form-control-custom" placeholder="10-digit mobile" required>
            </div>

            <div class="col-md-6">
                <label class="form-label font-weight-bold fs-7">Aadhaar Number</label>
                <input type="text" th:field="*{aadhaar}" class="form-control form-control-custom" placeholder="12-digit Aadhaar">
            </div>
            <div class="col-md-6">
                <label class="form-label font-weight-bold fs-7">Ration Card Number</label>
                <input type="text" th:field="*{rationCard}" class="form-control form-control-custom" placeholder="e.g. RC-10293">
            </div>

            <div class="col-md-6">
                <label class="form-label font-weight-bold fs-7">Ward Number *</label>
                <select th:field="*{wardNumber}" class="form-select form-control-custom" required>
                    <option value="Ward 1">Ward 1 - East Sector</option>
                    <option value="Ward 2">Ward 2 - Market Area</option>
                    <option value="Ward 3">Ward 3 - North Sector</option>
                    <option value="Ward 4">Ward 4 - South Sector</option>
                    <option value="Ward 5">Ward 5 - Agri Colony</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label font-weight-bold fs-7">Occupation</label>
                <input type="text" th:field="*{occupation}" class="form-control form-control-custom" placeholder="e.g. Farmer / Merchant / Student">
            </div>

            <div class="col-md-6">
                <label class="form-label font-weight-bold fs-7">Email Address</label>
                <input type="email" th:field="*{email}" class="form-control form-control-custom" placeholder="name@example.com">
            </div>
            <div class="col-md-6">
                <label class="form-label font-weight-bold fs-7">Household Members</label>
                <input type="number" th:field="*{householdMembers}" class="form-control form-control-custom" min="1" max="20" placeholder="Number of family members">
            </div>

            <div class="col-12">
                <label class="form-label font-weight-bold fs-7">Village Address</label>
                <textarea th:field="*{address}" class="form-control form-control-custom" rows="2" placeholder="House no, Street name, Village"></textarea>
            </div>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 py-2.5 mt-4 justify-content-center">
            <i class="fa-solid fa-user-plus me-2"></i> Register Account
        </button>
    </form>

    <div class="mt-3 text-center fs-7 text-muted">
        Already registered? <a href="/login" class="text-primary fw-bold text-decoration-none">Back to Login</a>
    </div>
</div>

</body>
</html>
