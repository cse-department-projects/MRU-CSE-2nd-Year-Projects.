<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Village System - Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-bg">

<div class="auth-card">
    <div class="auth-header">
        <div class="auth-logo">
            <i class="fa-solid fa-tree-city"></i>
        </div>
        <h4 class="fw-extrabold text-dark mb-1">Smart Village System</h4>
        <p class="text-muted fs-7">Empowering rural governance & digital services</p>
    </div>

    <!-- Feedback Alerts -->
    <div th:if="${errorMessage != null}" class="alert alert-danger alert-custom mb-3">
        <i class="fa-solid fa-circle-exclamation me-2"></i>
        <span th:text="${errorMessage}">Error message</span>
    </div>
    <div th:if="${successMessage != null}" class="alert alert-success alert-custom mb-3">
        <i class="fa-solid fa-circle-check me-2"></i>
        <span th:text="${successMessage}">Success message</span>
    </div>

    <!-- Role Switcher -->
    <div class="role-switcher">
        <button type="button" class="role-btn" id="btnRoleCitizen" onclick="selectRole('CITIZEN')">
            <i class="fa-solid fa-user me-1"></i> Citizen Login
        </button>
        <button type="button" class="role-btn" id="btnRoleAdmin" onclick="selectRole('ADMIN')">
            <i class="fa-solid fa-user-shield me-1"></i> Admin Login
        </button>
    </div>

    <!-- Login Form -->
    <form th:action="@{/login}" method="post">
        <input type="hidden" name="role" id="selectedRoleInput" th:value="${selectedRole != null ? selectedRole : 'CITIZEN'}">

        <div class="mb-3">
            <label class="form-label font-weight-bold fs-7 text-secondary">Username</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fa-regular fa-user text-muted"></i></span>
                <input type="text" name="username" id="usernameInput" class="form-control form-control-custom border-start-0" placeholder="Enter your username" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label font-weight-bold fs-7 text-secondary">Password</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                <input type="password" name="password" id="passwordInput" class="form-control form-control-custom border-start-0" placeholder="Enter password" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 py-2.5 mt-2 justify-content-center">
            <i class="fa-solid fa-right-to-bracket me-2"></i> Login to Portal
        </button>
    </form>

    <!-- Demo Quick Login Helper -->
    <div class="mt-4 pt-3 border-top text-center">
        <div class="text-muted fs-8 mb-2 fw-semibold">Quick Demo Login Credentials:</div>
        <div class="d-flex gap-2 justify-content-center">
            <button class="btn btn-sm btn-outline-primary rounded-pill px-3 fs-8" onclick="fillDemo('citizen', 'citizen123', 'CITIZEN')">
                <i class="fa-solid fa-user me-1"></i> Demo Citizen
            </button>
            <button class="btn btn-sm btn-outline-dark rounded-pill px-3 fs-8" onclick="fillDemo('admin', 'admin123', 'ADMIN')">
                <i class="fa-solid fa-user-shield me-1"></i> Demo Admin
            </button>
        </div>
    </div>

    <div class="mt-3 text-center fs-7 text-muted">
        New Citizen? <a href="/register" class="text-primary fw-bold text-decoration-none">Register Account</a>
    </div>
</div>

<script>
    function selectRole(role) {
        document.getElementById('selectedRoleInput').value = role;
        const btnCitizen = document.getElementById('btnRoleCitizen');
        const btnAdmin = document.getElementById('btnRoleAdmin');
        if (role === 'ADMIN') {
            btnAdmin.classList.add('active');
            btnCitizen.classList.remove('active');
        } else {
            btnCitizen.classList.add('active');
            btnAdmin.classList.remove('active');
        }
    }

    function fillDemo(user, pass, role) {
        selectRole(role);
        document.getElementById('usernameInput').value = user;
        document.getElementById('passwordInput').value = pass;
    }

    // Initialize initial state based on hidden input
    document.addEventListener("DOMContentLoaded", function() {
        const initialRole = document.getElementById('selectedRoleInput').value;
        selectRole(initialRole);
    });
</script>

</body>
</html>
