<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News & Announcements Management - Smart Village Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar(activeMenu='admin_news', role='ADMIN')}"></div>

    <main class="app-main">
        <div th:replace="~{fragments/navbar :: navbar(pageTitle='Village News Bulletins & Gram Sabha Announcements Desk', userObj=${admin})}"></div>

        <div class="content-body">
            <div th:if="${successMessage != null}" class="alert alert-success alert-custom mb-4">
                <i class="fa-solid fa-circle-check me-2"></i>
                <span th:text="${successMessage}">Announcement published</span>
            </div>

            <!-- Toolbar & Create Modal Trigger -->
            <div class="custom-table-container">
                <div class="table-toolbar">
                    <div class="d-flex align-items-center gap-3">
                        <h6 class="fw-bold mb-0"><i class="fa-solid fa-bullhorn me-2 text-primary"></i> Published Village Bulletins & Notices</h6>
                    </div>
                    <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#addNewsModal">
                        <i class="fa-solid fa-plus me-1"></i> Publish New Announcement
                    </button>
                </div>

                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Category</th>
                                <th>Priority</th>
                                <th>Title</th>
                                <th>Target Audience</th>
                                <th>Posted Date</th>
                                <th>Content Preview</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="n : ${newsList}">
                                <td><span class="badge bg-primary-subtle text-primary" th:text="${n.category}">GRAM_SABHA</span></td>
                                <td>
                                    <span th:if="${n.priority == 'HIGH' or n.priority == 'URGENT'}" class="badge bg-danger">HIGH</span>
                                    <span th:if="${n.priority == 'NORMAL'}" class="badge bg-secondary">NORMAL</span>
                                </td>
                                <td class="fw-bold text-dark" th:text="${n.title}">Title</td>
                                <td><span class="badge bg-light text-dark border" th:text="${n.targetAudience}">ALL</span></td>
                                <td class="fs-8 text-muted" th:text="${#temporals.format(n.postedDate, 'dd MMM yyyy, HH:mm')}">Date</td>
                                <td class="text-muted fs-8" th:text="${#strings.abbreviate(n.content, 70)}">Content snippet...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Modal: Publish Announcement -->
<div class="modal fade" id="addNewsModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header border-bottom">
                <h5 class="modal-title fw-bold">Publish New Village Announcement</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/admin/news/add}" method="post">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label font-weight-bold fs-7">Announcement Title *</label>
                        <input type="text" name="title" class="form-control form-control-custom" placeholder="e.g. Gram Sabha Special Body Meeting" required>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label font-weight-bold fs-7">Category *</label>
                            <select name="category" class="form-select form-control-custom">
                                <option value="GRAM_SABHA">Gram Sabha Notice</option>
                                <option value="HEALTH">Health & Vaccination</option>
                                <option value="SCHEME">Government Scheme</option>
                                <option value="FESTIVAL">Festival / Event</option>
                                <option value="WEATHER">Weather Advisory</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label font-weight-bold fs-7">Priority Level *</label>
                            <select name="priority" class="form-select form-control-custom">
                                <option value="NORMAL">NORMAL</option>
                                <option value="HIGH">HIGH Priority</option>
                                <option value="URGENT">URGENT Alert</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label font-weight-bold fs-7">Target Audience *</label>
                        <select name="targetAudience" class="form-select form-control-custom">
                            <option value="ALL">All Village Citizens</option>
                            <option value="FARMERS">Farmers / Agriculture</option>
                            <option value="SENIOR_CITIZENS">Senior Citizens</option>
                            <option value="YOUTH">Youth & Students</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label font-weight-bold fs-7">Full Bulletin Content *</label>
                        <textarea name="content" class="form-control form-control-custom" rows="4" placeholder="Write full bulletin text..." required></textarea>
                    </div>
                </div>
                <div class="modal-footer border-top">
                    <button type="button" class="btn btn-secondary-custom" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary-custom">Publish Bulletin</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
