<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilities Management - Smart Village Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar(activeMenu='admin_utilities', role='ADMIN')}"></div>

    <main class="app-main">
        <div th:replace="~{fragments/navbar :: navbar(pageTitle='Village Infrastructure & Utility Management Desk', userObj=${admin})}"></div>

        <div class="content-body">
            <div th:if="${successMessage != null}" class="alert alert-success alert-custom mb-4">
                <i class="fa-solid fa-circle-check me-2"></i>
                <span th:text="${successMessage}">Utility schedule posted</span>
            </div>

            <!-- Toolbar & Add Utility Modal Trigger -->
            <div class="custom-table-container">
                <div class="table-toolbar">
                    <div class="d-flex align-items-center gap-3">
                        <h6 class="fw-bold mb-0"><i class="fa-solid fa-bolt me-2 text-warning"></i> Utility Maintenance Notices & Schedules Master Grid</h6>
                    </div>
                    <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#addUtilityModal">
                        <i class="fa-solid fa-plus me-1"></i> Post New Utility Notice
                    </button>
                </div>

                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Utility Type</th>
                                <th>Notice Title</th>
                                <th>Affected Wards</th>
                                <th>Schedule Date & Time</th>
                                <th>Status</th>
                                <th>Details</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${utilities}">
                                <td>
                                    <span th:if="${u.utilityType == 'WATER_SUPPLY'}" class="badge bg-info text-white">Water Supply</span>
                                    <span th:if="${u.utilityType == 'POWER_OUTAGE'}" class="badge bg-warning text-dark">Power Outage</span>
                                    <span th:if="${u.utilityType == 'WASTE_COLLECTION'}" class="badge bg-success text-white">Sanitation Route</span>
                                    <span th:if="${u.utilityType == 'STREET_MAINTENANCE'}" class="badge bg-secondary text-white">Maintenance</span>
                                </td>
                                <td class="fw-bold text-dark" th:text="${u.title}">Notice Title</td>
                                <td th:text="${u.areaAffected}">Wards 1, 2</td>
                                <td class="fw-semibold text-primary" th:text="${u.scheduleDate}">Schedule Date</td>
                                <td><span class="badge bg-light text-dark border" th:text="${u.status}">SCHEDULED</span></td>
                                <td th:text="${u.details}">Details</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Modal: Add Utility Notice -->
<div class="modal fade" id="addUtilityModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header border-bottom">
                <h5 class="modal-title fw-bold">Post New Utility Schedule Notice</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/admin/utilities/add}" method="post">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label font-weight-bold fs-7">Utility Category *</label>
                        <select name="utilityType" class="form-select form-control-custom" required>
                            <option value="WATER_SUPPLY">Water Supply Schedule</option>
                            <option value="POWER_OUTAGE">Power Outage Maintenance</option>
                            <option value="WASTE_COLLECTION">Door-to-Door Waste Collection Route</option>
                            <option value="STREET_MAINTENANCE">Streetlight / Road Repair Works</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label font-weight-bold fs-7">Notice Title *</label>
                        <input type="text" name="title" class="form-control form-control-custom" placeholder="e.g. Overhead Water Tank Cleaning" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label font-weight-bold fs-7">Wards / Areas Affected *</label>
                        <input type="text" name="areaAffected" class="form-control form-control-custom" placeholder="e.g. Wards 1, 2, and 3" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label font-weight-bold fs-7">Schedule Date & Time *</label>
                        <input type="text" name="scheduleDate" class="form-control form-control-custom" placeholder="e.g. Oct 08, 9:00 AM - 1:00 PM" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label font-weight-bold fs-7">Notice Status *</label>
                        <select name="status" class="form-select form-control-custom">
                            <option value="SCHEDULED">SCHEDULED</option>
                            <option value="IN_PROGRESS">IN_PROGRESS</option>
                            <option value="COMPLETED">COMPLETED</option>
                            <option value="DELAYED">DELAYED</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label font-weight-bold fs-7">Details & Public Guidance *</label>
                        <textarea name="details" class="form-control form-control-custom" rows="3" placeholder="Provide instructions for citizens..." required></textarea>
                    </div>
                </div>
                <div class="modal-footer border-top">
                    <button type="button" class="btn btn-secondary-custom" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary-custom">Publish Utility Notice</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
