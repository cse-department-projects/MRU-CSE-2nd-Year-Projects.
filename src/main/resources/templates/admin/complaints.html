<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint Management - Smart Village Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar(activeMenu='admin_complaints', role='ADMIN')}"></div>

    <main class="app-main">
        <div th:replace="~{fragments/navbar :: navbar(pageTitle='Village Grievances & Complaint Resolution Desk', userObj=${admin})}"></div>

        <div class="content-body">
            <div th:if="${successMessage != null}" class="alert alert-success alert-custom mb-4">
                <i class="fa-solid fa-circle-check me-2"></i>
                <span th:text="${successMessage}">Complaint updated</span>
            </div>

            <!-- Complaints Table -->
            <div class="custom-table-container">
                <div class="table-toolbar">
                    <div class="d-flex align-items-center gap-3">
                        <h6 class="fw-bold mb-0"><i class="fa-solid fa-triangle-exclamation me-2 text-danger"></i> All Village Complaints Master Grid</h6>
                    </div>
                    <div class="d-flex gap-2">
                        <select class="form-select form-control-custom table-category-filter" style="max-width: 180px;" data-target-table="adminComplaintsTable">
                            <option value="all">All Categories</option>
                            <option value="Water">Water</option>
                            <option value="Electricity">Electricity</option>
                            <option value="Roads">Roads</option>
                            <option value="Sanitation">Sanitation</option>
                            <option value="Streetlights">Streetlights</option>
                        </select>
                        <input type="text" class="form-control form-control-custom table-search-input" style="max-width: 220px;" data-target-table="adminComplaintsTable" placeholder="Search ticket / citizen...">
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table" id="adminComplaintsTable">
                        <thead>
                            <tr>
                                <th>Ticket No</th>
                                <th>Citizen Name</th>
                                <th>Category & Title</th>
                                <th>Location</th>
                                <th>Priority</th>
                                <th>Status</th>
                                <th>Assigned Officer</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${complaints}" th:data-category="${c.category}">
                                <td class="fw-bold text-primary" th:text="${c.ticketNo}">TKT-001</td>
                                <td>
                                    <div class="fw-bold" th:text="${c.user.fullName}">Citizen</div>
                                    <div class="text-muted fs-8" th:text="${c.user.phone}">Phone</div>
                                </td>
                                <td>
                                    <div class="fw-bold" th:text="${c.title}">Title</div>
                                    <span class="badge bg-light text-dark border" th:text="${c.category}">Category</span>
                                </td>
                                <td>
                                    <div th:text="${c.location}">Location</div>
                                    <div class="badge bg-secondary-subtle text-dark fs-8" th:text="${c.wardNumber}">Ward 3</div>
                                </td>
                                <td>
                                    <span th:if="${c.priority == 'HIGH' or c.priority == 'URGENT'}" class="badge bg-danger" th:text="${c.priority}">HIGH</span>
                                    <span th:if="${c.priority == 'MEDIUM'}" class="badge bg-warning text-dark">MEDIUM</span>
                                    <span th:if="${c.priority == 'LOW'}" class="badge bg-secondary">LOW</span>
                                </td>
                                <td>
                                    <span th:if="${c.status == 'PENDING'}" class="badge-status status-pending">PENDING</span>
                                    <span th:if="${c.status == 'IN_PROGRESS'}" class="badge-status status-progress">IN PROGRESS</span>
                                    <span th:if="${c.status == 'RESOLVED'}" class="badge-status status-resolved">RESOLVED</span>
                                    <span th:if="${c.status == 'REJECTED'}" class="badge-status status-rejected">REJECTED</span>
                                </td>
                                <td class="fw-semibold text-dark" th:text="${c.assignedOfficer != null ? c.assignedOfficer : 'Not Assigned'}">Officer</td>
                                <td>
                                    <button class="btn btn-sm btn-primary-custom" data-bs-toggle="modal" th:data-bs-target="${'#updateComplaintModal' + c.id}">
                                        <i class="fa-solid fa-pen-to-square me-1"></i> Resolve / Update
                                    </button>

                                    <!-- Update Modal inside loop -->
                                    <div class="modal fade text-start" th:id="${'updateComplaintModal' + c.id}" tabindex="-1">
                                        <div class="modal-dialog modal-dialog-centered">
                                            <div class="modal-content border-0 shadow-lg rounded-4">
                                                <div class="modal-header border-bottom">
                                                    <h5 class="modal-title fw-bold" th:text="${'Update Complaint: ' + c.ticketNo}">Update Complaint</h5>
                                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                                </div>
                                                <form th:action="@{/admin/complaints/update}" method="post">
                                                    <input type="hidden" name="id" th:value="${c.id}">
                                                    <div class="modal-body">
                                                        <div class="mb-3">
                                                            <label class="form-label font-weight-bold fs-7">Complaint Details</label>
                                                            <div class="p-3 bg-light rounded border fs-7" th:text="${c.description}">Description text</div>
                                                        </div>

                                                        <div class="mb-3">
                                                            <label class="form-label font-weight-bold fs-7">Status *</label>
                                                            <select name="status" class="form-select form-control-custom">
                                                                <option value="PENDING" th:selected="${c.status == 'PENDING'}">PENDING</option>
                                                                <option value="IN_PROGRESS" th:selected="${c.status == 'IN_PROGRESS'}">IN_PROGRESS</option>
                                                                <option value="RESOLVED" th:selected="${c.status == 'RESOLVED'}">RESOLVED</option>
                                                                <option value="REJECTED" th:selected="${c.status == 'REJECTED'}">REJECTED</option>
                                                            </select>
                                                        </div>

                                                        <div class="mb-3">
                                                            <label class="form-label font-weight-bold fs-7">Assign Field Officer / Department</label>
                                                            <input type="text" name="assignedOfficer" th:value="${c.assignedOfficer}" class="form-control form-control-custom" placeholder="e.g. Lineman Suresh / Water Technician Ramesh">
                                                        </div>

                                                        <div class="mb-3">
                                                            <label class="form-label font-weight-bold fs-7">Admin Resolution Remarks / Action Taken *</label>
                                                            <textarea name="adminRemarks" class="form-control form-control-custom" rows="3" th:text="${c.adminRemarks}" placeholder="Provide details regarding inspection, repair work done, or reason for status..." required></textarea>
                                                        </div>
                                                    </div>
                                                    <div class="modal-footer border-top">
                                                        <button type="button" class="btn btn-secondary-custom" data-bs-dismiss="modal">Close</button>
                                                        <button type="submit" class="btn btn-primary-custom">Save Status Update</button>
                                                    </div>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
