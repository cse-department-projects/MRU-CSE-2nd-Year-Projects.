<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheme Application Management - Smart Village Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar(activeMenu='applications', role='ADMIN')}"></div>

    <main class="app-main">
        <div th:replace="~{fragments/navbar :: navbar(pageTitle='Government & Rural Scheme Application Management Desk', userObj=${admin})}"></div>

        <div class="content-body">
            <div th:if="${successMessage != null}" class="alert alert-success alert-custom mb-4">
                <i class="fa-solid fa-circle-check me-2"></i>
                <span th:text="${successMessage}">Application status updated</span>
            </div>

            <div class="custom-table-container">
                <div class="table-toolbar">
                    <h6 class="fw-bold mb-0"><i class="fa-solid fa-file-signature me-2 text-primary"></i> Citizen Scheme Applications Review Grid</h6>
                    <input type="text" class="form-control form-control-custom table-search-input" style="max-width: 240px;" data-target-table="adminAppsTable" placeholder="Search application...">
                </div>

                <div class="table-responsive">
                    <table class="table" id="adminAppsTable">
                        <thead>
                            <tr>
                                <th>App Ref No</th>
                                <th>Applicant Citizen</th>
                                <th>Scheme Name</th>
                                <th>Category</th>
                                <th>Submission Date</th>
                                <th>Status</th>
                                <th>Panchayat Remarks</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="app : ${applications}">
                                <td class="fw-bold text-primary" th:text="${app.appNumber}">APP-101</td>
                                <td>
                                    <div class="fw-bold" th:text="${app.user.fullName}">Citizen Name</div>
                                    <div class="text-muted fs-8" th:text="${app.user.wardNumber}">Ward 3</div>
                                </td>
                                <td class="fw-semibold text-dark" th:text="${app.serviceName}">Solar Pump</td>
                                <td><span class="badge bg-light text-dark border" th:text="${app.category}">Subsidy</span></td>
                                <td th:text="${#temporals.format(app.submissionDate, 'dd MMM yyyy')}">Date</td>
                                <td>
                                    <span th:if="${app.status == 'SUBMITTED'}" class="badge-status status-submitted">SUBMITTED</span>
                                    <span th:if="${app.status == 'UNDER_REVIEW'}" class="badge-status status-progress">UNDER REVIEW</span>
                                    <span th:if="${app.status == 'APPROVED'}" class="badge-status status-approved">APPROVED</span>
                                    <span th:if="${app.status == 'REJECTED'}" class="badge-status status-rejected">REJECTED</span>
                                </td>
                                <td th:text="${app.remarks != null ? app.remarks : 'Pending verification'}">Remarks</td>
                                <td>
                                    <button class="btn btn-sm btn-primary-custom" data-bs-toggle="modal" th:data-bs-target="${'#appModal' + app.id}">
                                        <i class="fa-solid fa-file-circle-check me-1"></i> Review / Action
                                    </button>

                                    <!-- Review Modal -->
                                    <div class="modal fade text-start" th:id="${'appModal' + app.id}" tabindex="-1">
                                        <div class="modal-dialog modal-dialog-centered">
                                            <div class="modal-content border-0 shadow-lg rounded-4">
                                                <div class="modal-header border-bottom">
                                                    <h5 class="modal-title fw-bold" th:text="${'Review Application: ' + app.appNumber}">Review Application</h5>
                                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                                </div>
                                                <form th:action="@{/admin/applications/update}" method="post">
                                                    <input type="hidden" name="id" th:value="${app.id}">
                                                    <div class="modal-body">
                                                        <div class="mb-3">
                                                            <label class="form-label font-weight-bold fs-7">Applicant Requirements Details</label>
                                                            <div class="p-3 bg-light rounded border fs-7" th:text="${app.description}">Description</div>
                                                        </div>

                                                        <div class="mb-3">
                                                            <label class="form-label font-weight-bold fs-7">Verification Decision Status *</label>
                                                            <select name="status" class="form-select form-control-custom">
                                                                <option value="SUBMITTED" th:selected="${app.status == 'SUBMITTED'}">SUBMITTED</option>
                                                                <option value="UNDER_REVIEW" th:selected="${app.status == 'UNDER_REVIEW'}">UNDER REVIEW</option>
                                                                <option value="APPROVED" th:selected="${app.status == 'APPROVED'}">APPROVED</option>
                                                                <option value="REJECTED" th:selected="${app.status == 'REJECTED'}">REJECTED</option>
                                                            </select>
                                                        </div>

                                                        <div class="mb-3">
                                                            <label class="form-label font-weight-bold fs-7">Official Remarks / Certificate Reference *</label>
                                                            <textarea name="remarks" class="form-control form-control-custom" rows="3" th:text="${app.remarks}" placeholder="Enter sanction approval reference, verification certificate no, or rejection notes..." required></textarea>
                                                        </div>
                                                    </div>
                                                    <div class="modal-footer border-top">
                                                        <button type="button" class="btn btn-secondary-custom" data-bs-dismiss="modal">Close</button>
                                                        <button type="submit" class="btn btn-primary-custom">Update Application Status</button>
                                                    </div>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
