<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Management - Smart Village Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar(activeMenu='citizens', role='ADMIN')}"></div>

    <main class="app-main">
        <div th:replace="~{fragments/navbar :: navbar(pageTitle='Village Citizen Directory & Verification Registry', userObj=${admin})}"></div>

        <div class="content-body">
            <div th:if="${successMessage != null}" class="alert alert-success alert-custom mb-4">
                <i class="fa-solid fa-circle-check me-2"></i>
                <span th:text="${successMessage}">Citizen added</span>
            </div>

            <!-- Toolbar & Add Citizen Modal Trigger -->
            <div class="custom-table-container">
                <div class="table-toolbar">
                    <div class="d-flex align-items-center gap-3">
                        <h6 class="fw-bold mb-0"><i class="fa-solid fa-users me-2 text-primary"></i> Registered Citizen Database</h6>
                        <span class="badge bg-primary rounded-pill" th:text="${#lists.size(citizens) + ' Total'}">0</span>
                    </div>

                    <div class="d-flex gap-2">
                        <input type="text" class="form-control form-control-custom table-search-input" style="max-width: 240px;" data-target-table="citizensRegistryTable" placeholder="Search by name, aadhaar, ward...">
                        <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#addCitizenModal">
                            <i class="fa-solid fa-user-plus me-1"></i> Register New Citizen
                        </button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table" id="citizensRegistryTable">
                        <thead>
                            <tr>
                                <th>Citizen Name</th>
                                <th>Username</th>
                                <th>Contact Phone</th>
                                <th>Ward No</th>
                                <th>Aadhaar Card</th>
                                <th>Ration Card</th>
                                <th>Occupation</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${citizens}">
                                <td class="fw-bold text-dark fs-6">
                                    <i class="fa-solid fa-circle-user text-primary me-2"></i>
                                    <span th:text="${c.fullName}">Full Name</span>
                                </td>
                                <td class="text-muted" th:text="${c.username}">username</td>
                                <td th:text="${c.phone}">9876543210</td>
                                <td><span class="badge bg-light text-dark border" th:text="${c.wardNumber}">Ward 3</span></td>
                                <td th:text="${c.aadhaar != null ? c.aadhaar : 'N/A'}">Aadhaar</td>
                                <td th:text="${c.rationCard != null ? c.rationCard : 'N/A'}">Ration Card</td>
                                <td th:text="${c.occupation != null ? c.occupation : 'Farmer'}">Occupation</td>
                                <td><span class="badge bg-success" th:text="${c.status}">ACTIVE</span></td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" th:data-bs-target="${'#viewModal' + c.id}">
                                        <i class="fa-solid fa-eye me-1"></i> Details
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Modal: Add New Citizen -->
<div class="modal fade" id="addCitizenModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header border-bottom">
                <h5 class="modal-title fw-bold">Register New Citizen Entry</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/admin/citizens/add}" method="post" th:object="${newUser}">
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label font-weight-bold fs-7">Full Name *</label>
                            <input type="text" th:field="*{fullName}" class="form-control form-control-custom" placeholder="Citizen full name" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label font-weight-bold fs-7">Username *</label>
                            <input type="text" th:field="*{username}" class="form-control form-control-custom" placeholder="Username" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label font-weight-bold fs-7">Default Password *</label>
                            <input type="password" th:field="*{password}" class="form-control form-control-custom" placeholder="Password" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label font-weight-bold fs-7">Phone Number *</label>
                            <input type="tel" th:field="*{phone}" class="form-control form-control-custom" placeholder="Mobile" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label font-weight-bold fs-7">Ward Number *</label>
                            <select th:field="*{wardNumber}" class="form-select form-control-custom" required>
                                <option value="Ward 1">Ward 1 - East Sector</option>
                                <option value="Ward 2">Ward 2 - Market Area</option>
                                <option value="Ward 3">Ward 3 - North Sector</option>
                                <option value="Ward 4">Ward 4 - South Sector</option>
                                <option value="Ward 5">Ward 5 - Agri Colony</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label font-weight-bold fs-7">Aadhaar Card</label>
                            <input type="text" th:field="*{aadhaar}" class="form-control form-control-custom" placeholder="12-digit Aadhaar">
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-top">
                    <button type="button" class="btn btn-secondary-custom" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary-custom">Save Citizen Record</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
