<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password — ENVIORA</title>
    <!-- SEO Meta Tags -->
    <meta name="description" content="Recover your ENVIORA account access. Enter your email to receive a secure password reset link.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">

    <div class="auth-page-centered">
        
        <!-- Floating Leaf Animation Container -->
        <div class="auth-leaf-container"></div>

        <!-- Centered Card Box -->
        <div class="auth-card-centered">
            
            <!-- Top Navigation -->
            <div class="auth-top-nav">
                <a href="login.html" class="auth-back-link">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span>Back to Sign In</span>
                </a>

                <a href="index.html" class="auth-mobile-logo" style="display: inline-flex;">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke-dasharray="4 2"/>
                        <path d="M12 18V9" stroke="#81C784"/>
                        <path d="M12 12C12 12 14.5 10 16 12C17.5 14 15 15 12 15" stroke="#81C784"/>
                    </svg>
                    <span>ENVIORA</span>
                </a>
            </div>

            <!-- Header Content -->
            <div class="auth-header" style="text-align: center; margin-bottom: 24px;">
                <div class="feature-icon-wrapper" style="margin: 0 auto 16px; width: 56px; height: 56px; background-color: rgba(46, 125, 52, 0.1);">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 28px; height: 28px;">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <div class="auth-brand-subtitle">ACCOUNT RECOVERY</div>
                <h1 class="auth-title" style="font-size: 1.85rem;">Reset Your Password</h1>
                <p class="auth-subtitle" style="font-size: 0.9rem; max-width: 360px; margin: 0 auto;">Enter your registered email address and we'll send you a recovery link to reset your credentials.</p>
            </div>

            <!-- Feedback Alert -->
            <div class="auth-alert auth-alert-success" id="auth-success-alert" role="alert"></div>

            <!-- Form -->
            <form class="auth-form" id="forgot-form" novalidate>
                
                <!-- Email Input -->
                <div class="form-group">
                    <label for="forgot-email" class="form-label">Email Address</label>
                    <div class="input-with-icon">
                        <input type="email" id="forgot-email" class="form-control-input" placeholder="name@example.com" autocomplete="email" required>
                        <span class="input-icon-left">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                        </span>
                    </div>
                    <div class="field-error-msg" id="forgot-email-error"></div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-auth-submit" id="forgot-submit-btn">
                    <span>Send Reset Link</span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>

            <!-- Back Link Footer -->
            <div class="auth-footer" style="margin-top: 24px;">
                <span>Remember your password?</span>
                <a href="login.html" class="auth-switch-link">Sign In</a>
            </div>

        </div>
    </div>

    <!-- Auth Script -->
    <script src="auth.js"></script>
</body>
</html>
