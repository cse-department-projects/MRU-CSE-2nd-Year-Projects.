# ---------------------------------------------------------------
# VMTS Backend configuration
# ---------------------------------------------------------------

spring.application.name=vmts-backend
server.port=${SERVER_PORT:8081}

# MySQL Database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:vmts_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Security
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
vmts.jwt.secret=${JWT_SECRET}
vmts.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# CORS
vmts.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*}

# Seed demo data
vmts.seed.enabled=${SEED_DEMO_DATA:true}

# Error responses
server.error.include-stacktrace=never
server.error.include-message=never