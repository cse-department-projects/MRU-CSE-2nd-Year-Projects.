<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Prescription | SmartMedication</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            color: #193653;

            background:
                radial-gradient(
                    circle at 10% 20%,
                    rgba(74, 210, 215, 0.18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 70%,
                    rgba(100, 181, 246, 0.16),
                    transparent 30%
                ),
                #f5fbfd;
        }

        /* ================================
           NAVBAR
        ================================= */

        .navbar {
            height: 75px;
            padding: 0 7%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            background: rgba(255,255,255,0.95);

            border-bottom: 1px solid #e1edf1;

            box-shadow:
                0 5px 25px
                rgba(40,100,120,0.07);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

            color: #159da5;

            text-decoration: none;

            font-size: 21px;
            font-weight: bold;
        }

        .logo-icon {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #e5fafa;
            border-radius: 12px;

            font-size: 23px;
        }

        .back-btn {
            text-decoration: none;

            color: #58758d;

            font-weight: 600;
            font-size: 14px;
        }

        .back-btn:hover {
            color: #159da5;
        }

        /* ================================
           MAIN
        ================================= */

        .container {
            max-width: 1100px;
            margin: auto;

            padding: 50px 25px 70px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 38px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #718797;
        }

        /* ================================
           UPLOAD CARD
        ================================= */

        .upload-card {
            background: white;

            border: 1px solid #e3edf1;

            border-radius: 22px;

            padding: 35px;

            box-shadow:
                0 15px 40px
                rgba(40,100,120,0.07);

            margin-bottom: 30px;
        }

        .upload-area {
            border: 2px dashed #b9dfe3;

            border-radius: 18px;

            padding: 45px 25px;

            text-align: center;

            background: #f8fcfd;

            cursor: pointer;

            transition: 0.2s;
        }

        .upload-area:hover {
            border-color: #159da5;
            background: #f2fbfc;
        }

        .upload-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .upload-area h2 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .upload-area p {
            color: #718797;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .choose-btn {
            display: inline-block;

            padding: 12px 22px;

            border-radius: 10px;

            background: #159da5;
            color: white;

            font-weight: bold;

            cursor: pointer;
        }

        #prescriptionFile {
            display: none;
        }

        .file-name {
            margin-top: 15px;

            color: #159da5;

            font-size: 14px;
            font-weight: bold;
        }

        .preview-container {
            display: none;

            margin-top: 25px;

            text-align: center;
        }

        .preview-container img {
            max-width: 100%;
            max-height: 400px;

            border-radius: 14px;

            border: 1px solid #dcebef;
        }

        .scan-btn {
            width: 100%;

            margin-top: 25px;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background: #159da5;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        .scan-btn:hover {
            background: #118b92;
        }

        .scan-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ================================
           MESSAGE
        ================================= */

        .message {
            display: none;

            padding: 13px;

            border-radius: 10px;

            margin-bottom: 20px;

            font-size: 14px;
        }

        .success {
            display: block;

            background: #e1f7e8;
            color: #23834b;
        }

        .error {
            display: block;

            background: #ffe5e5;
            color: #c0392b;
        }

        .info {
            display: block;

            background: #e6f5fa;
            color: #2876a7;
        }

        /* ================================
           DETECTED SECTION
        ================================= */

        .detected-section {
            display: none;
        }

        .section-title {
            margin-bottom: 18px;
        }

        .section-title h2 {
            font-size: 25px;
        }

        .section-title p {
            margin-top: 5px;
            color: #718797;
            font-size: 14px;
        }

        /* ================================
           MEDICINE CARD
        ================================= */

        .prescription-medicine {
            background: white;

            border: 1px solid #e3edf1;

            border-radius: 18px;

            padding: 25px;

            margin-bottom: 20px;

            box-shadow:
                0 10px 30px
                rgba(40,100,120,0.06);
        }

        .medicine-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;
        }

        .medicine-number {
            display: flex;
            align-items: center;
            gap: 10px;

            font-weight: bold;
            font-size: 18px;
        }

        .medicine-number span {
            width: 36px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #e6f9fa;

            border-radius: 10px;
        }

        .remove-btn {
            border: none;

            background: #ffe7e7;

            color: #c0392b;

            padding: 8px 12px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;
        }

        .fields {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 16px;
        }

        .form-group {
            margin-bottom: 5px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: bold;

            color: #31536c;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid #dcebef;

            border-radius: 10px;

            outline: none;

            font-family: inherit;

            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #159da5;
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        /* ================================
           TIMES
        ================================= */

        .times-section {
            grid-column: 1 / -1;

            margin-top: 5px;

            padding: 18px;

            background: #f7fbfc;

            border-radius: 13px;
        }

        .times-title {
            font-size: 14px;
            font-weight: bold;

            margin-bottom: 12px;
        }

        .times-container {
            display: flex;

            flex-wrap: wrap;

            gap: 10px;
        }

        .time-item {
            display: flex;

            align-items: center;

            gap: 6px;
        }

        .time-item input {
            width: 140px;
        }

        .remove-time {
            border: none;

            width: 30px;
            height: 30px;

            border-radius: 8px;

            background: #ffe7e7;

            color: #c0392b;

            cursor: pointer;

            font-weight: bold;
        }

        .add-time-btn {
            margin-top: 12px;

            border: none;

            padding: 9px 14px;

            border-radius: 9px;

            background: #e5f4ff;

            color: #2876a7;

            cursor: pointer;

            font-weight: bold;
        }

        /* ================================
           FINAL BUTTONS
        ================================= */

        .final-actions {
            display: flex;

            gap: 15px;

            margin-top: 25px;
        }

        .add-medicines-btn {
            flex: 1;

            border: none;

            padding: 16px;

            border-radius: 12px;

            background: #22a861;

            color: white;

            font-weight: bold;

            font-size: 15px;

            cursor: pointer;
        }

        .add-medicines-btn:hover {
            background: #188b4e;
        }

        .clear-btn {
            padding: 16px 25px;

            border: none;

            border-radius: 12px;

            background: #f1f6f8;

            color: #58758d;

            font-weight: bold;

            cursor: pointer;
        }

        /* ================================
           LOADING
        ================================= */

        .loading {
            display: none;

            text-align: center;

            padding: 25px;

            color: #718797;
        }

        .spinner {
            width: 35px;
            height: 35px;

            margin: 0 auto 12px;

            border: 4px solid #dcebef;

            border-top-color: #159da5;

            border-radius: 50%;

            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ================================
           RESPONSIVE
        ================================= */

        @media(max-width:700px) {

            .container {
                padding: 35px 18px;
            }

            .page-header h1 {
                font-size: 30px;
            }

            .upload-card {
                padding: 20px;
            }

            .fields {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .times-section {
                grid-column: auto;
            }

            .final-actions {
                flex-direction: column;
            }

        }

    </style>

</head>

<body>


<!-- =====================================
     NAVBAR
====================================== -->

<nav class="navbar">

    <a href="index.html" class="logo">

        <div class="logo-icon">
            💊
        </div>

        SmartMedication

    </a>

    <a href="index.html" class="back-btn">
        ← Back to Home
    </a>

</nav>


<!-- =====================================
     MAIN
====================================== -->

<main class="container">

    <div class="page-header">

        <h1>
            Prescription Scanner 📄
        </h1>

        <p>
            Upload your prescription and add
            the medicines to your medication schedule.
        </p>

    </div>


    <!-- =================================
         UPLOAD
    ================================== -->

    <div class="upload-card">

        <div
            id="message"
            class="message">
        </div>


        <label
            for="prescriptionFile"
            class="upload-area">

            <div class="upload-icon">
                📄
            </div>

            <h2>
                Upload Prescription
            </h2>

            <p>
                Upload a clear image of your prescription.
            </p>

            <span class="choose-btn">
                📤 Choose Prescription
            </span>

            <input
                type="file"
                id="prescriptionFile"
                accept="image/*">

            <div
                id="fileName"
                class="file-name">
            </div>

        </label>


        <div
            id="previewContainer"
            class="preview-container">

            <img
                id="prescriptionPreview"
                alt="Prescription Preview">

        </div>


        <div
            id="loading"
            class="loading">

            <div class="spinner"></div>

            Reading prescription...

        </div>


        <button
            id="scanButton"
            class="scan-btn"
            onclick="scanPrescription()"
            disabled>

            🔍 Scan Prescription

        </button>

    </div>


    <!-- =================================
         DETECTED MEDICINES
    ================================== -->

    <section
        id="detectedSection"
        class="detected-section">

        <div class="section-title">

            <h2>
                Detected Medicines 💊
            </h2>

            <p>
                Please review the information before
                adding it to your medicines and reminders.
            </p>

        </div>


        <div id="medicineList"></div>


        <div class="final-actions">

            <button
                class="clear-btn"
                onclick="clearPrescription()">

                🔄 Start Again

            </button>

            <button
                id="addMedicinesButton"
                class="add-medicines-btn"
                onclick="addMedicinesAndReminders()">

                ✅ Add to My Medicines & Reminders

            </button>

        </div>

    </section>

</main>


<script>

/* ==========================================
   USER
========================================== */

const USER_ID = 1;


/* ==========================================
   DATA
========================================== */

let detectedMedicines = [];

let selectedFile = null;


/* ==========================================
   FILE SELECTION
========================================== */

document
    .getElementById("prescriptionFile")
    .addEventListener("change", function(event) {

        const file = event.target.files[0];

        if (!file) {
            return;
        }

        selectedFile = file;

        document.getElementById("fileName")
            .textContent =
            "Selected: " + file.name;

        document.getElementById("scanButton")
            .disabled = false;


        /*
         * Preview image
         */

        if (file.type.startsWith("image/")) {

            const reader =
                new FileReader();

            reader.onload = function(e) {

                document.getElementById(
                    "prescriptionPreview"
                ).src = e.target.result;

                document.getElementById(
                    "previewContainer"
                ).style.display = "block";

            };

            reader.readAsDataURL(file);

        }

    });


/* ==========================================
   SCAN PRESCRIPTION
========================================== */

async function scanPrescription() {

    if (!selectedFile) {

        showMessage(
            "Please select a prescription first.",
            "error"
        );

        return;
    }


    const button =
        document.getElementById(
            "scanButton"
        );

    const loading =
        document.getElementById(
            "loading"
        );


    button.disabled = true;

    button.textContent =
        "Reading...";

    loading.style.display =
        "block";


    try {

        /*
         * BACKEND OCR ENDPOINT
         *
         * We will create this endpoint
         * in Spring Boot next.
         */

        const formData =
            new FormData();

        formData.append(
            "file",
            selectedFile
        );

        formData.append(
            "userId",
            USER_ID
        );


        const response =
            await fetch(
                "http://localhost:8080/api/prescriptions/scan",
                {
                    method: "POST",
                    body: formData
                }
            );


        if (!response.ok) {

            throw new Error(
                "Prescription scanning failed."
            );

        }


        const result =
            await response.json();


        /*
         * Expected backend response:
         *
         * {
         *   medicines: [
         *     {
         *       name: "Paracetamol",
         *       dosage: "500 mg",
         *       frequency: "Twice Daily",
         *       instructions: "After food"
         *     }
         *   ]
         * }
         */


        detectedMedicines =
            result.medicines || [];


        if (
            detectedMedicines.length === 0
        ) {

            /*
             * If OCR finds nothing,
             * show a manual medicine form.
             */

            detectedMedicines = [
                {
                    name: "",
                    dosage: "",
                    frequency: "Daily",
                    instructions: "",
                    times: ["09:00"]
                }
            ];

            showMessage(
                "No medicines were detected automatically. Please enter the details manually.",
                "info"
            );

        }
        else {

            detectedMedicines =
                detectedMedicines.map(
                    medicine => ({

                        name:
                            medicine.name || "",

                        dosage:
                            medicine.dosage || "",

                        frequency:
                            medicine.frequency ||
                            "Daily",

                        instructions:
                            medicine.instructions ||
                            "",

                        times:
                            medicine.times ||
                            getDefaultTimes(
                                medicine.frequency
                            )

                    })
                );

            showMessage(
                "Prescription scanned successfully. Please review the detected information.",
                "success"
            );

        }


        displayDetectedMedicines();


    }
    catch (error) {

        console.error(error);

        /*
         * For now we show manual entry
         * if the OCR backend is not ready.
         */

        detectedMedicines = [
            {
                name: "",
                dosage: "",
                frequency: "Daily",
                instructions: "",
                times: ["09:00"]
            }
        ];

        displayDetectedMedicines();

        showMessage(
            "OCR service is not connected yet. You can enter the prescription details manually.",
            "info"
        );

    }
    finally {

        button.disabled = false;

        button.textContent =
            "🔍 Scan Prescription";

        loading.style.display =
            "none";

    }

}


/* ==========================================
   DEFAULT TIMES
========================================== */

function getDefaultTimes(frequency) {

    if (
        frequency ===
        "Twice Daily"
    ) {

        return [
            "09:00",
            "21:00"
        ];

    }


    if (
        frequency ===
        "Three Times Daily"
    ) {

        return [
            "08:00",
            "14:00",
            "20:00"
        ];

    }


    if (
        frequency ===
        "Weekly"
    ) {

        return [
            "09:00"
        ];

    }


    return [
        "09:00"
    ];

}


/* ==========================================
   DISPLAY MEDICINES
========================================== */

function displayDetectedMedicines() {

    const section =
        document.getElementById(
            "detectedSection"
        );

    const list =
        document.getElementById(
            "medicineList"
        );


    list.innerHTML = "";


    detectedMedicines.forEach(
        (medicine, index) => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "prescription-medicine";


            card.innerHTML = `

                <div class="medicine-header">

                    <div class="medicine-number">

                        <span>
                            💊
                        </span>

                        Medicine ${index + 1}

                    </div>

                    <button
                        class="remove-btn"
                        onclick="
                            removeMedicine(${index})
                        ">

                        🗑 Remove

                    </button>

                </div>


                <div class="fields">

                    <div class="form-group">

                        <label>
                            💊 Medicine Name
                        </label>

                        <input
                            type="text"
                            value="${escapeHtml(medicine.name)}"
                            onchange="
                                updateMedicine(
                                    ${index},
                                    'name',
                                    this.value
                                )
                            "
                            placeholder="Medicine name"
                            required>

                    </div>


                    <div class="form-group">

                        <label>
                            💊 Dosage
                        </label>

                        <input
                            type="text"
                            value="${escapeHtml(medicine.dosage)}"
                            onchange="
                                updateMedicine(
                                    ${index},
                                    'dosage',
                                    this.value
                                )
                            "
                            placeholder="Example: 500 mg"
                            required>

                    </div>


                    <div class="form-group">

                        <label>
                            🔄 Frequency
                        </label>

                        <select
                            onchange="
                                updateFrequency(
                                    ${index},
                                    this.value
                                )
                            ">

                            <option
                                value="Daily"
                                ${medicine.frequency === "Daily" ? "selected" : ""}>
                                Daily
                            </option>

                            <option
                                value="Twice Daily"
                                ${medicine.frequency === "Twice Daily" ? "selected" : ""}>
                                Twice Daily
                            </option>

                            <option
                                value="Three Times Daily"
                                ${medicine.frequency === "Three Times Daily" ? "selected" : ""}>
                                Three Times Daily
                            </option>

                            <option
                                value="Weekly"
                                ${medicine.frequency === "Weekly" ? "selected" : ""}>
                                Weekly
                            </option>

                            <option
                                value="As Needed"
                                ${medicine.frequency === "As Needed" ? "selected" : ""}>
                                As Needed
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            📅 Start Date
                        </label>

                        <input
                            type="date"
                            value="${medicine.startDate || getToday()}"
                            onchange="
                                updateMedicine(
                                    ${index},
                                    'startDate',
                                    this.value
                                )
                            ">

                    </div>


                    <div class="form-group full">

                        <label>
                            📝 Instructions
                        </label>

                        <textarea
                            onchange="
                                updateMedicine(
                                    ${index},
                                    'instructions',
                                    this.value
                                )
                            "
                            placeholder="Example: Take after breakfast">${escapeHtml(medicine.instructions)}</textarea>

                    </div>


                    <div class="times-section">

                        <div class="times-title">

                            ⏰ Reminder Times

                        </div>

                        <div
                            class="times-container"
                            id="times-${index}">

                        </div>

                        <button
                            type="button"
                            class="add-time-btn"
                            onclick="
                                addReminderTime(
                                    ${index}
                                )
                            ">

                            ➕ Add Another Time

                        </button>

                    </div>

                </div>

            `;


            list.appendChild(card);


            renderTimes(index);

        }
    );


    section.style.display =
        "block";


    section.scrollIntoView({
        behavior: "smooth"
    });

}


/* ==========================================
   RENDER TIMES
========================================== */

function renderTimes(index) {

    const container =
        document.getElementById(
            `times-${index}`
        );


    if (!container) {
        return;
    }


    container.innerHTML = "";


    detectedMedicines[index].times =
        detectedMedicines[index].times ||
        [];


    detectedMedicines[index]
        .times
        .forEach(
            (time, timeIndex) => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "time-item";


                item.innerHTML = `

                    <input
                        type="time"
                        value="${time}"
                        onchange="
                            updateReminderTime(
                                ${index},
                                ${timeIndex},
                                this.value
                            )
                        ">

                    <button
                        type="button"
                        class="remove-time"
                        onclick="
                            removeReminderTime(
                                ${index},
                                ${timeIndex}
                            )
                        ">

                        ×

                    </button>

                `;


                container.appendChild(item);

            }
        );

}


/* ==========================================
   UPDATE MEDICINE
========================================== */

function updateMedicine(
    index,
    field,
    value
) {

    detectedMedicines[index][field] =
        value;

}


/* ==========================================
   UPDATE FREQUENCY
========================================== */

function updateFrequency(
    index,
    value
) {

    detectedMedicines[index].frequency =
        value;


    /*
     * Automatically suggest times
     * based on frequency.
     */

    detectedMedicines[index].times =
        getDefaultTimes(value);


    displayDetectedMedicines();

}


/* ==========================================
   ADD TIME
========================================== */

function addReminderTime(index) {

    if (!detectedMedicines[index].times) {

        detectedMedicines[index].times =
            [];

    }


    detectedMedicines[index].times.push(
        "09:00"
    );


    renderTimes(index);

}


/* ==========================================
   UPDATE TIME
========================================== */

function updateReminderTime(
    medicineIndex,
    timeIndex,
    value
) {

    detectedMedicines[
        medicineIndex
    ].times[
        timeIndex
    ] = value;

}


/* ==========================================
   REMOVE TIME
========================================== */

function removeReminderTime(
    medicineIndex,
    timeIndex
) {

    detectedMedicines[
        medicineIndex
    ].times.splice(
        timeIndex,
        1
    );


    renderTimes(
        medicineIndex
    );

}


/* ==========================================
   REMOVE MEDICINE
========================================== */

function removeMedicine(index) {

    detectedMedicines.splice(
        index,
        1
    );


    displayDetectedMedicines();

}


/* ==========================================
   ADD TO MEDICINES + REMINDERS
========================================== */

async function addMedicinesAndReminders() {

    if (
        detectedMedicines.length === 0
    ) {

        showMessage(
            "No medicines available.",
            "error"
        );

        return;

    }


    const button =
        document.getElementById(
            "addMedicinesButton"
        );


    button.disabled = true;

    button.textContent =
        "Saving medicines and reminders...";


    try {

        for (
            const medicine
            of detectedMedicines
        ) {

            if (
                !medicine.name.trim()
            ) {

                throw new Error(
                    "Every medicine must have a name."
                );

            }


            if (
                !medicine.dosage.trim()
            ) {

                throw new Error(
                    `Please enter dosage for ${medicine.name}.`
                );

            }


            /*
             * 1. CREATE MEDICINE
             */

            const medicineResponse =
                await fetch(
                    "http://localhost:8080/api/medicines",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                name:
                                    medicine.name.trim(),

                                dosage:
                                    medicine.dosage.trim(),

                                frequency:
                                    medicine.frequency,

                                instructions:
                                    medicine.instructions
                                        ? medicine.instructions.trim()
                                        : "",

                                user: {
                                    id: USER_ID
                                }

                            })

                    }
                );


            if (
                !medicineResponse.ok
            ) {

                const text =
                    await medicineResponse.text();

                throw new Error(
                    text ||
                    `Unable to save ${medicine.name}`
                );

            }


            const savedMedicine =
                await medicineResponse.json();


            /*
             * 2. CREATE REMINDERS
             */

            const times =
                medicine.times || [];


            for (
                const time
                of times
            ) {

                if (!time) {
                    continue;
                }


                const reminderResponse =
                    await fetch(
                        "http://localhost:8080/api/reminders",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    medicine: {
                                        id:
                                            savedMedicine.id
                                    },

                                    reminderDate:
                                        medicine.startDate ||
                                        getToday(),

                                    reminderTime:
                                        time + ":00",

                                    status:
                                        "PENDING"

                                })

                        }
                    );


                if (
                    !reminderResponse.ok
                ) {

                    throw new Error(
                        `Medicine saved but reminder could not be created for ${medicine.name}.`
                    );

                }

            }

        }


        showMessage(
            "✅ Medicines and reminder times were added successfully!",
            "success"
        );


        button.textContent =
            "✅ Successfully Added";


        setTimeout(
            () => {

                window.location.href =
                    "reminders.html";

            },
            1500
        );


    }
    catch (error) {

        console.error(error);


        showMessage(
            "❌ " + error.message,
            "error"
        );


        button.disabled =
            false;

        button.textContent =
            "✅ Add to My Medicines & Reminders";

    }

}


/* ==========================================
   CLEAR
========================================== */

function clearPrescription() {

    selectedFile = null;

    detectedMedicines = [];


    document.getElementById(
        "prescriptionFile"
    ).value = "";


    document.getElementById(
        "fileName"
    ).textContent = "";


    document.getElementById(
        "previewContainer"
    ).style.display = "none";


    document.getElementById(
        "detectedSection"
    ).style.display = "none";


    document.getElementById(
        "scanButton"
    ).disabled = true;


    clearMessage();


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* ==========================================
   MESSAGE
========================================== */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );

    message.textContent =
        text;

    message.className =
        `message ${type}`;

}


function clearMessage() {

    const message =
        document.getElementById(
            "message"
        );

    message.textContent = "";

    message.className =
        "message";

}


/* ==========================================
   TODAY
========================================== */

function getToday() {

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            now.getDate()
        ).padStart(2, "0");

    return `${year}-${month}-${day}`;

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHtml(value) {

    return String(value || "")

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}
