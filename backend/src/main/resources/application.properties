# Server Configuration
server.port=8080

# Application Name
spring.application.name=road-safety-system

# Database Configuration (H2 In-Memory DB with MySQL Mode)
spring.datasource.url=jdbc:h2:mem:roadsafetydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Settings
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Database Initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Static Web Resources Configuration (Serve frontend files)
spring.web.resources.static-locations=file:../frontend/,file:frontend/,classpath:/static/

